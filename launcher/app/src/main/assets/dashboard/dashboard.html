<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Reset & TV Canvas ── */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      background: transparent !important;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .view {
      display: block !important;
      background: transparent !important;
      position: relative;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
    }
    .dashboard-wallpaper {
      display: none !important;
    }

    /* ── Main Grid ── */
    .dashboard-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: 245px 265px !important;
      gap: 12px !important;
      padding: 10px 24px 10px 24px !important;
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
    }

    /* ── Quad Glass Cards ── */
    .quad {
      border-radius: 16px !important;
      padding: 12px 18px !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      height: 100% !important;
      max-height: 100% !important;
      background: rgba(14, 18, 24, 0.88) !important;
      backdrop-filter: blur(24px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(160%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45) !important;
    }
    .quad--top {
      grid-column: 1 / 3 !important;
      height: 245px !important;
    }
    .quad--sw, .quad--se {
      height: 265px !important;
    }
    .quad__header {
      margin-bottom: 8px !important;
      flex-shrink: 0 !important;
    }
    .quad__title {
      color: #FFFFFF !important;
      font-size: 19px !important;
      font-weight: 700 !important;
      line-height: 1.15 !important;
      margin: 2px 0 0 0 !important;
    }
    .quad__subtitle {
      color: rgba(255, 255, 255, 0.65) !important;
      font-size: 11px !important;
      margin: 2px 0 0 0 !important;
    }
    .pill-badge {
      font-size: 10px !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      padding: 2px 8px !important;
      border-radius: 999px !important;
      background: rgba(255, 255, 255, 0.12) !important;
      color: #E3D5CA !important;
      display: inline-block !important;
    }
    .pill-badge--warm {
      background: rgba(227, 213, 202, 0.18) !important;
      color: #F5EBE0 !important;
    }
    .quad__status-dot {
      width: 7px !important;
      height: 7px !important;
      border-radius: 50% !important;
      background: #34C759 !important;
      box-shadow: 0 0 8px #34C759 !important;
      display: inline-block !important;
      margin-left: 6px !important;
    }

    /* ── Back to Launcher Button ── */
    .dashboard-back-btn {
      position: absolute !important;
      top: 12px !important;
      right: 26px !important;
      z-index: 100 !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 6px 14px !important;
      background: rgba(255, 255, 255, 0.15) !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-radius: 999px !important;
      color: #FFFFFF !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      backdrop-filter: blur(12px) !important;
      transition: all 0.15s ease !important;
      outline: none !important;
    }
    .dashboard-back-btn:focus,
    .dashboard-back-btn:hover {
      background: rgba(255, 255, 255, 0.35) !important;
      outline: 2px solid #FFFFFF !important;
      transform: scale(1.03) !important;
    }

    /* ── To-Do List Grid ── */
    .todo-list.todo-list--grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-auto-rows: min-content !important;
      gap: 6px 14px !important;
      overflow: hidden !important;
      flex: 1 !important;
      align-content: start !important;
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }
    .todo-item {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      cursor: pointer !important;
      outline: none !important;
      transition: all 0.15s ease !important;
      min-height: 38px !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 9px !important;
      padding: 5px 12px !important;
      box-sizing: border-box !important;
    }
    .todo-item:focus {
      outline: 2px solid #E3D5CA !important;
      background: rgba(255, 255, 255, 0.22) !important;
      transform: scale(1.01) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
    }
    .todo-item.done {
      opacity: 0.55 !important;
    }
    .todo-item.done .todo-item__text {
      text-decoration: line-through !important;
      color: rgba(255, 255, 255, 0.5) !important;
    }
    .todo-item__check {
      width: 17px !important;
      height: 17px !important;
      border-radius: 5px !important;
      border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
      background: rgba(255, 255, 255, 0.05) !important;
    }
    .todo-item.done .todo-item__check {
      background: #34C759 !important;
      border-color: #34C759 !important;
    }
    .todo-item__check svg {
      width: 11px !important;
      height: 11px !important;
      stroke: #fff !important;
      stroke-width: 3 !important;
      display: none !important;
    }
    .todo-item.done .todo-item__check svg {
      display: block !important;
    }
    .todo-item__content {
      display: flex !important;
      flex-direction: column !important;
      min-width: 0 !important;
      flex: 1 !important;
    }
    .todo-item__text {
      color: #FFFFFF !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .todo-item__meta {
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 10px !important;
      margin-top: 1px !important;
    }
    .todo-item__tag {
      font-size: 9px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      background: rgba(255, 255, 255, 0.12) !important;
      color: rgba(255, 255, 255, 0.8) !important;
    }
    .todo-item__tag--archived {
      background: rgba(255, 255, 255, 0.1) !important;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* ── Recipe Cards ── */
    .recipe-list {
      display: flex !important;
      flex-direction: column !important;
      gap: 5px !important;
      overflow: hidden !important;
      flex: 1 !important;
    }
    .recipe-card {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      background: rgba(255, 255, 255, 0.07) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #fff !important;
      padding: 5px 10px !important;
      border-radius: 10px !important;
    }
    .recipe-card__emoji {
      width: 28px !important;
      height: 28px !important;
      border-radius: 7px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 15px !important;
      flex-shrink: 0 !important;
    }
    .recipe-card__info {
      display: flex !important;
      flex-direction: column !important;
      min-width: 0 !important;
      flex: 1 !important;
    }
    .recipe-card__name {
      color: #FFFFFF !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .recipe-card__meta {
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 10px !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .recipe-card__time {
      color: #E3D5CA !important;
      background: rgba(227, 213, 202, 0.15) !important;
      font-size: 10px !important;
      font-weight: 600 !important;
      padding: 2px 7px !important;
      border-radius: 6px !important;
      flex-shrink: 0 !important;
    }

    /* ── Calendar Events ── */
    .calendar-events {
      display: flex !important;
      flex-direction: column !important;
      gap: 3px !important;
      overflow: hidden !important;
      flex: 1 !important;
    }
    .calendar-event {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      background: rgba(255, 255, 255, 0.06) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      color: #fff !important;
      padding: 3px 10px !important;
      border-radius: 7px !important;
    }
    .calendar-event__time {
      color: #E3D5CA !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      min-width: 60px !important;
    }
    .calendar-event__dot {
      width: 6px !important;
      height: 6px !important;
      border-radius: 50% !important;
      background: #38bdf8 !important;
      flex-shrink: 0 !important;
    }
    .calendar-event__title {
      color: #FFFFFF !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      flex: 1 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .calendar-day-label {
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 9.5px !important;
      font-weight: 700 !important;
      letter-spacing: 0.1em !important;
      text-transform: uppercase !important;
      margin: 2px 0 1px 0 !important;
    }
    .date-badge {
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #E3D5CA !important;
      background: rgba(227, 213, 202, 0.12) !important;
      padding: 3px 8px !important;
      border-radius: 6px !important;
    }
  </style>
</head>
<body>
  <div id="dashboard" class="view active">
    <button class="dashboard-back-btn" id="dashboard-back-btn" tabindex="0" title="Back to Launcher">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Launcher (↩ Back)</span>
    </button>

    <div class="dashboard-grid">
      <!-- Combined Top Panel: To-Do List -->
      <div class="quad quad--top quad--todos">
        <div class="quad__header">
          <div class="quad__header-left">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="pill-badge">POCKETBASE · LIVE DISPLAY</span>
              <span class="pill-badge pill-badge--warm" id="todo-display-badge">Display Board</span>
            </div>
            <div class="quad__title-row">
              <h2 class="quad__title">To-Do List</h2>
              <span id="pb-status-dot" class="quad__status-dot" title="PocketBase Connected"></span>
            </div>
            <p class="quad__subtitle">Press OK on any item to complete · ↩ Back returns to Launcher</p>
          </div>
          <div class="quad__header-right"></div>
        </div>
        <ul class="todo-list todo-list--grid" id="todo-list"></ul>
      </div>

      <!-- SW: Recipe Ideas -->
      <div class="quad quad--sw">
        <div class="quad__header">
          <div class="quad__header-left">
            <span class="pill-badge pill-badge--warm">DAILY PICKS</span>
            <h3 class="quad__title">Recipe Ideas</h3>
            <p class="quad__subtitle">Fresh & balanced dinner options</p>
          </div>
        </div>
        <div class="recipe-list" id="recipe-list"></div>
      </div>

      <!-- SE: Calendar -->
      <div class="quad quad--se">
        <div class="quad__header">
          <div class="quad__header-left">
            <span class="pill-badge pill-badge--warm">SCHEDULE</span>
            <h3 class="quad__title">Upcoming Events</h3>
            <p class="quad__subtitle">Today & tomorrow agenda</p>
          </div>
          <div class="quad__header-right">
            <span class="date-badge" id="dashboard-date"></span>
          </div>
        </div>
        <div class="calendar-events" id="calendar-events"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
