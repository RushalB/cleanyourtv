<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Daily Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="dashboard" class="view active">
    <div class="sheet">
      <!-- Masthead Header -->
      <header class="masthead">
        <div class="masthead-left">
          <h1 class="masthead-date" id="dashboard-date">Today</h1>
          <span class="masthead-day" id="dashboard-day">Daily Ledger</span>
        </div>
        <div class="masthead-right">
          <div class="sync-status">
            <span id="pb-status-dot" class="status-dot" title="PocketBase Status"></span>
            <span>PocketBase</span>
          </div>
          <span class="clock-display" id="dashboard-clock"></span>
          <button class="back-btn" id="dashboard-back-btn" tabindex="0" title="Back to Launcher">Launcher (↩)</button>
        </div>
      </header>

      <!-- Ledger Spread -->
      <div class="spread">
        <!-- Left: Primary Tasks on Ruled Ledger Lines -->
        <section class="tasks-column">
          <div class="column-title">
            <span>Focus & Tasks</span>
            <span class="count" id="todo-display-badge">Loading...</span>
          </div>
          <ul class="todo-stream" id="todo-list"></ul>
        </section>

        <!-- Right: Schedule & Meals -->
        <aside class="right-column">
          <div class="sidebar-section">
            <div class="column-title">
              <span>Schedule</span>
              <span class="count">Today</span>
            </div>
            <div class="timeline-stream" id="calendar-events"></div>
          </div>

          <div class="sidebar-section">
            <div class="column-title">
              <span>Nourish</span>
              <span class="count">Dinner Ideas</span>
            </div>
            <div class="meal-stream" id="recipe-list"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
