<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Reset & TV Canvas ── */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      background: #141312 !important;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .view {
      display: block !important;
      background: #141312 !important;
      position: relative;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
    }
    .dashboard-wallpaper {
      display: none !important;
    }

    /* ── Main Grid: Generous Breathing Room ── */
    .dashboard-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: 242px 226px !important;
      gap: 18px !important;
      padding: 24px 36px 24px 36px !important;
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      background: #141312 !important;
    }

    /* ── Minimal Flat Cards ── */
    .quad {
      border-radius: 16px !important;
      padding: 18px 24px !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      height: 100% !important;
      max-height: 100% !important;
      background: #1E1B19 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid #2D2723 !important;
      box-shadow: none !important;
    }
    .quad--top {
      grid-column: 1 / 3 !important;
      height: 242px !important;
    }
    .quad--sw, .quad--se {
      height: 226px !important;
    }

    /* ── Clean Headers (No badges cluttering the top, no filler subtitles) ── */
    .quad__header {
      margin-bottom: 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      flex-shrink: 0 !important;
    }
    .quad__header-left {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 10px !important;
    }
    .quad__title {
      color: #F5EBE0 !important;
      font-size: 20px !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em !important;
      margin: 0 !important;
    }
    .quad__subtitle {
      display: none !important;
    }
    .pill-badge {
      display: none !important;
    }
    #todo-display-badge {
      display: inline-block !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 3px 10px !important;
      border-radius: 999px !important;
      background: #2A2521 !important;
      color: #D6CCC2 !important;
      letter-spacing: 0.02em !important;
      text-transform: none !important;
      border: none !important;
    }

    .quad__status-dot {
      width: 6px !important;
      height: 6px !important;
      border-radius: 50% !important;
      background: #34C759 !important;
      display: inline-block !important;
      margin-left: 2px !important;
      box-shadow: none !important;
    }

    /* ── Minimal Top Right Action ── */
    .dashboard-back-btn {
      position: absolute !important;
      top: 24px !important;
      right: 36px !important;
      z-index: 100 !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      padding: 6px 14px !important;
      background: #26221F !important;
      border: 1px solid #36302A !important;
      border-radius: 999px !important;
      color: #D6CCC2 !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      backdrop-filter: none !important;
      transition: all 0.15s ease !important;
      outline: none !important;
    }
    .dashboard-back-btn:focus,
    .dashboard-back-btn:hover {
      background: #332D27 !important;
      border-color: #E3D5CA !important;
      color: #F5EBE0 !important;
    }

    /* ── To-Do List Grid ── */
    .todo-list.todo-list--grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-auto-rows: min-content !important;
      gap: 10px 18px !important;
      overflow: hidden !important;
      flex: 1 !important;
      align-content: start !important;
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }
    .todo-item {
      display: flex !important;
      align-items: center !important;
      gap: 14px !important;
      cursor: pointer !important;
      outline: none !important;
      transition: all 0.15s ease !important;
      height: 48px !important;
      min-height: 48px !important;
      background: #26221F !important;
      border: 1px solid #332D28 !important;
      border-radius: 10px !important;
      padding: 0 16px !important;
      box-sizing: border-box !important;
    }
    .todo-item:focus {
      outline: 2px solid #E3D5CA !important;
      background: #302A24 !important;
      border-color: #E3D5CA !important;
    }
    .todo-item.done {
      opacity: 0.35 !important;
      background: #1C1917 !important;
    }
    .todo-item.done .todo-item__text {
      text-decoration: line-through !important;
      color: #8C847B !important;
    }
    .todo-item__check {
      width: 20px !important;
      height: 20px !important;
      border-radius: 6px !important;
      border: 1.5px solid #6E665D !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
      background: #1A1715 !important;
    }
    .todo-item.done .todo-item__check {
      background: #D5BDAF !important;
      border-color: #D5BDAF !important;
    }
    .todo-item__check svg {
      width: 12px !important;
      height: 12px !important;
      stroke: #141312 !important;
      stroke-width: 3.5 !important;
      display: none !important;
    }
    .todo-item.done .todo-item__check svg {
      display: block !important;
    }
    .todo-item__content {
      display: flex !important;
      flex-direction: column !important;
      min-width: 0 !important;
      flex: 1 !important;
    }
    .todo-item__text {
      color: #F5EBE0 !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .todo-item__meta {
      display: none !important;
    }
    .todo-item__tag {
      font-size: 9px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      padding: 3px 8px !important;
      border-radius: 4px !important;
      background: #D5BDAF !important;
      color: #141312 !important;
    }
    .todo-item__tag--archived {
      background: #332D28 !important;
      color: #A39B92 !important;
    }

    /* ── Recipe Cards ── */
    .recipe-list {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      overflow: hidden !important;
      flex: 1 !important;
    }
    .recipe-card {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      background: #26221F !important;
      border: 1px solid #332D28 !important;
      color: #F5EBE0 !important;
      padding: 0 16px !important;
      border-radius: 10px !important;
      height: 44px !important;
    }
    .recipe-card__emoji {
      font-size: 18px !important;
      flex-shrink: 0 !important;
      background: none !important;
    }
    .recipe-card__info {
      display: flex !important;
      flex-direction: column !important;
      min-width: 0 !important;
      flex: 1 !important;
    }
    .recipe-card__name {
      color: #F5EBE0 !important;
      font-size: 13.5px !important;
      font-weight: 500 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .recipe-card__meta {
      display: none !important;
    }
    .recipe-card__time {
      color: #D6CCC2 !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      padding: 0 !important;
      background: none !important;
      flex-shrink: 0 !important;
    }

    /* ── Calendar Events ── */
    .calendar-events {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      overflow: hidden !important;
      flex: 1 !important;
    }
    .calendar-event {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      background: #26221F !important;
      border: 1px solid #332D28 !important;
      color: #F5EBE0 !important;
      padding: 0 16px !important;
      border-radius: 10px !important;
      height: 44px !important;
    }
    .calendar-event__time {
      color: #E3D5CA !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      min-width: 68px !important;
    }
    .calendar-event__dot {
      width: 6px !important;
      height: 6px !important;
      border-radius: 50% !important;
      background: #D5BDAF !important;
      flex-shrink: 0 !important;
    }
    .calendar-event__title {
      color: #F5EBE0 !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      flex: 1 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .calendar-event__duration {
      color: #8C847B !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      background: none !important;
      padding: 0 !important;
      flex-shrink: 0 !important;
    }
    .calendar-day-label {
      display: none !important;
    }
    .date-badge {
      font-size: 12px !important;
      font-weight: 500 !important;
      color: #D6CCC2 !important;
      background: none !important;
      padding: 0 !important;
    }
  </style>
</head>
<body>
  <div id="dashboard" class="view active">
    <button class="dashboard-back-btn" id="dashboard-back-btn" tabindex="0" title="Back to Launcher">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Launcher</span>
    </button>

    <div class="dashboard-grid">
      <!-- Top Panel: To-Do List -->
      <div class="quad quad--top quad--todos">
        <div class="quad__header">
          <div class="quad__header-left">
            <h2 class="quad__title">To-Do List</h2>
            <span id="pb-status-dot" class="quad__status-dot" title="PocketBase Connected"></span>
            <span id="todo-display-badge">2 open</span>
          </div>
          <div class="quad__header-right"></div>
        </div>
        <ul class="todo-list todo-list--grid" id="todo-list"></ul>
      </div>

      <!-- SW: Recipe Ideas -->
      <div class="quad quad--sw">
        <div class="quad__header">
          <div class="quad__header-left">
            <h3 class="quad__title">Recipe Ideas</h3>
          </div>
        </div>
        <div class="recipe-list" id="recipe-list"></div>
      </div>

      <!-- SE: Calendar -->
      <div class="quad quad--se">
        <div class="quad__header">
          <div class="quad__header-left">
            <h3 class="quad__title">Upcoming Events</h3>
          </div>
          <div class="quad__header-right">
            <span class="date-badge" id="dashboard-date"></span>
          </div>
        </div>
        <div class="calendar-events" id="calendar-events"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
