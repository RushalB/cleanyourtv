<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Family Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="dashboard" class="view active">
    <div class="canvas">
      <header class="masthead">
        <div class="masthead-left">
          <div class="date-row">
            <h1 class="date-heading" id="dashboard-date">Tuesday, October 29</h1>
            <span class="stamp-badge" id="dashboard-day">Week 44</span>
          </div>
          <div class="masthead-meta">
            <span id="pb-status-dot" class="sync-dot" title="PocketBase Status"></span>
            <span id="pb-status-label">Synced</span>
            <span>·</span>
            <span id="dashboard-location">Chicago</span>
          </div>
        </div>

        <div class="masthead-right">
          <div class="clock-weather-group">
            <div class="clock-hero">
              <span id="dashboard-clock">--:--</span>
              <span class="clock-ampm" id="dashboard-clock-ampm"></span>
            </div>
            <div class="weather-hero" id="weather-card">
              <span class="temp" id="weather-temp">--°</span>
              <div class="meta-col">
                <span class="cond-line" id="weather-cond">Loading...</span>
                <span class="feel-line" id="weather-feels">Feels --°</span>
              </div>
            </div>
          </div>
          <button class="home-tab" id="dashboard-back-btn" tabindex="0" title="Back to Launcher">↩ Home</button>
        </div>
      </header>

      <div class="spread">
        <!-- Column 1 (Left): Schedule & Nourish -->
        <aside class="col-left">
          <div>
            <div class="section-header">
              <span>Today's Rhythm</span>
              <span class="meta" id="schedule-count">3 Events</span>
            </div>
            <div id="calendar-events"></div>
          </div>

          <div>
            <div class="section-header">
              <span>On the Table</span>
              <span class="meta">Dinner Ideas</span>
            </div>
            <div id="recipe-list"></div>
          </div>
        </aside>

        <!-- Column 2 (Right): Daily Focus & Tasks -->
        <section class="col-right">
          <div class="section-header">
            <span>Daily Focus & Tasks</span>
            <span class="meta" id="todo-display-badge">Loading...</span>
          </div>
          <ul class="todo-list" id="todo-list"></ul>
        </section>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
